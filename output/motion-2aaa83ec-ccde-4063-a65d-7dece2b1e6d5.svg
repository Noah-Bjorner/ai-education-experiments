<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(31,31,31,0.10)" />
    </pattern>

    <!-- Normal curve path (μ=600, σ=120, baseline=560, amp=320) -->
    <path id="curvePath" d="M240,556.4
      C280,552 300,545 320,534.4
      C360,508 400,460 440,400.5
      C480,330 520,268 560,242.5
      C580,232 590,228 600,228
      C610,228 620,232 640,242.5
      C680,268 720,330 760,400.5
      C800,460 840,508 880,534.4
      C900,545 920,552 960,556.4" fill="none"/>

    <!-- Band clips / fills under curve -->
    <!-- Full under-curve region for reference -->
    <path id="underCurve" d="M240,556.4
      C280,552 300,545 320,534.4
      C360,508 400,460 440,400.5
      C480,330 520,268 560,242.5
      C580,232 590,228 600,228
      C610,228 620,232 640,242.5
      C680,268 720,330 760,400.5
      C800,460 840,508 880,534.4
      C900,545 920,552 960,556.4
      L960,560 L240,560 Z"/>

    <!-- ±1σ band: x 480–720 -->
    <path id="band1" d="M480,400.5
      C520,330 560,250 600,228
      C640,250 680,330 720,400.5
      L720,560 L480,560 Z"/>

    <!-- ±2σ wings (left 360–480, right 720–840) combined as outer ring piece -->
    <path id="band2" d="M360,508
      C400,460 440,400 480,400.5
      L480,560 L360,560 Z
      M720,400.5
      C760,400 800,460 840,508
      L840,560 L720,560 Z"/>

    <!-- ±3σ outer tails -->
    <path id="band3" d="M240,556.4
      C280,552 320,534 360,508
      L360,560 L240,560 Z
      M840,508
      C880,534 920,552 960,556.4
      L960,560 L840,560 Z"/>
  </defs>

  <style>
    .root-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .title {
      font-size: 36px;
      font-weight: 700;
      fill: #1F1F1F;
    }
    .subtitle {
      font-size: 20px;
      font-weight: 500;
      fill: #6B6B6B;
    }
    .axis-label {
      font-size: 18px;
      font-weight: 500;
      fill: #6B6B6B;
    }
    .tick-label {
      font-size: 16px;
      font-weight: 500;
      fill: #6B6B6B;
    }
    .mean-label {
      font-size: 18px;
      font-weight: 600;
      fill: #F54E00;
    }
    .pct-label {
      font-size: 22px;
      font-weight: 700;
      fill: #1F1F1F;
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
    }
    .pct-sub {
      font-size: 15px;
      font-weight: 500;
      fill: #6B6B6B;
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
    }
    .callout {
      font-size: 18px;
      font-weight: 600;
      fill: #1F1F1F;
      opacity: 0;
      animation: fadeInUp 0.7s ease-out forwards;
    }
    .callout-sub {
      font-size: 15px;
      font-weight: 400;
      fill: #6B6B6B;
      opacity: 0;
      animation: fadeInUp 0.7s ease-out forwards;
    }
    .curve-stroke {
      fill: none;
      stroke: #1F1F1F;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mean-line {
      stroke: #F54E00;
      stroke-width: 2;
      stroke-dasharray: 6 5;
    }
    .sigma-line {
      stroke: #979797;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }
    .band1-fill {
      fill: #F54E00;
      opacity: 0;
      animation: bandFade 0.8s ease-out forwards;
      animation-delay: 0.4s;
    }
    .band2-fill {
      fill: #F59E0B;
      opacity: 0;
      animation: bandFade2 0.8s ease-out forwards;
      animation-delay: 1.8s;
    }
    .band3-fill {
      fill: #06B6D4;
      opacity: 0;
      animation: bandFade3 0.8s ease-out forwards;
      animation-delay: 3.2s;
    }
    .bracket {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }
    .sym-arrow {
      fill: none;
      stroke: #06B6D4;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      animation: fadeIn 0.7s ease-out forwards;
      animation-delay: 6.2s;
    }
    .density-dot {
      opacity: 0;
      animation: dotPop 0.35s ease-out forwards;
    }
    .axis {
      stroke: #6B6B6B;
      stroke-width: 2;
      stroke-linecap: round;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bandFade {
      from { opacity: 0; }
      to { opacity: 0.35; }
    }
    @keyframes bandFade2 {
      from { opacity: 0; }
      to { opacity: 0.28; }
    }
    @keyframes bandFade3 {
      from { opacity: 0; }
      to { opacity: 0.22; }
    }
    @keyframes dotPop {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .anim-t1 { animation-delay: 1.2s; }
    .anim-t2 { animation-delay: 2.6s; }
    .anim-t3 { animation-delay: 4.0s; }
    .anim-c1 { animation-delay: 5.0s; }
    .anim-c2 { animation-delay: 5.6s; }
    .anim-c3 { animation-delay: 6.4s; }

    .sigma-d1 { animation-delay: 0.4s; }
    .sigma-d2 { animation-delay: 1.8s; }
    .sigma-d3 { animation-delay: 3.2s; }

    .dot-group .density-dot { transform-box: fill-box; transform-origin: center; }

    .pct-label, .pct-sub, .callout, .callout-sub {
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FCFAF8" />
  <rect width="1200" height="800" fill="url(#dotGrid)" />

  <!-- Title (static establishing) -->
  <text x="600" y="56" text-anchor="middle" class="root-text title">Normal Distribution</text>
  <text x="600" y="88" text-anchor="middle" class="root-text subtitle">The bell curve — values cluster around the mean</text>

  <!-- Graph group -->
  <g id="graph" transform="translate(0, 20)">
    <!-- Sigma bands (animated fills) -->
    <use href="#band3" class="band3-fill" />
    <use href="#band2" class="band2-fill" />
    <use href="#band1" class="band1-fill" />

    <!-- Vertical sigma guides -->
    <line x1="480" y1="220" x2="480" y2="560" class="sigma-line sigma-d1" />
    <line x1="720" y1="220" x2="720" y2="560" class="sigma-line sigma-d1" />
    <line x1="360" y1="220" x2="360" y2="560" class="sigma-line sigma-d2" />
    <line x1="840" y1="220" x2="840" y2="560" class="sigma-line sigma-d2" />
    <line x1="240" y1="220" x2="240" y2="560" class="sigma-line sigma-d3" />
    <line x1="960" y1="220" x2="960" y2="560" class="sigma-line sigma-d3" />

    <!-- Mean line -->
    <line x1="600" y1="210" x2="600" y2="560" class="mean-line" />

    <!-- Axes -->
    <line x1="180" y1="560" x2="1020" y2="560" class="axis" />
    <line x1="180" y1="200" x2="180" y2="568" class="axis" />

    <!-- Curve (present from start) -->
    <path d="M240,556.4
      C280,552 300,545 320,534.4
      C360,508 400,460 440,400.5
      C480,330 520,268 560,242.5
      C580,232 590,228 600,228
      C610,228 620,232 640,242.5
      C680,268 720,330 760,400.5
      C800,460 840,508 880,534.4
      C900,545 920,552 960,556.4" class="curve-stroke" />

    <!-- Tick marks on x-axis -->
    <g stroke="#6B6B6B" stroke-width="2">
      <line x1="240" y1="560" x2="240" y2="572" />
      <line x1="360" y1="560" x2="360" y2="572" />
      <line x1="480" y1="560" x2="480" y2="572" />
      <line x1="600" y1="560" x2="600" y2="574" />
      <line x1="720" y1="560" x2="720" y2="572" />
      <line x1="840" y1="560" x2="840" y2="572" />
      <line x1="960" y1="560" x2="960" y2="572" />
    </g>

    <!-- Tick labels -->
    <g class="root-text tick-label" text-anchor="middle">
      <text x="240" y="594">−3σ</text>
      <text x="360" y="594">−2σ</text>
      <text x="480" y="594">−1σ</text>
      <text x="600" y="594" class="mean-label" style="fill:#F54E00;font-weight:700;">μ</text>
      <text x="720" y="594">+1σ</text>
      <text x="840" y="594">+2σ</text>
      <text x="960" y="594">+3σ</text>
    </g>

    <text x="600" y="630" text-anchor="middle" class="root-text axis-label">Value</text>
    <text x="148" y="390" text-anchor="middle" class="root-text axis-label" transform="rotate(-90 148 390)">Frequency</text>

    <!-- Mean label above peak -->
    <text x="600" y="200" text-anchor="middle" class="root-text mean-label">Mean (μ)</text>

    <!-- Density dots under curve to reinforce clustering (static positions, staggered fade) -->
    <g class="dot-group">
      <!-- Center cluster (±1σ) — many dots -->
      <circle cx="600" cy="480" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.5s"/>
      <circle cx="580" cy="500" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.55s"/>
      <circle cx="620" cy="495" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.6s"/>
      <circle cx="560" cy="470" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.65s"/>
      <circle cx="640" cy="475" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.7s"/>
      <circle cx="545" cy="520" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.75s"/>
      <circle cx="655" cy="515" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.8s"/>
      <circle cx="510" cy="490" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.85s"/>
      <circle cx="690" cy="488" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.9s"/>
      <circle cx="600" cy="420" r="4" fill="#F54E00" class="density-dot" style="animation-delay:0.7s"/>
      <circle cx="575" cy="440" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.78s"/>
      <circle cx="625" cy="435" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.82s"/>
      <circle cx="530" cy="535" r="3" fill="#F54E00" class="density-dot" style="animation-delay:0.88s"/>
      <circle cx="670" cy="538" r="3" fill="#F54E00" class="density-dot" style="animation-delay:0.92s"/>
      <circle cx="590" cy="530" r="3.5" fill="#F54E00" class="density-dot" style="animation-delay:0.72s"/>
      <circle cx="610" cy="545" r="3" fill="#F54E00" class="density-dot" style="animation-delay:0.76s"/>

      <!-- ±2σ — fewer -->
      <circle cx="420" cy="520" r="3.5" fill="#F59E0B" class="density-dot" style="animation-delay:2.0s"/>
      <circle cx="400" cy="540" r="3" fill="#F59E0B" class="density-dot" style="animation-delay:2.1s"/>
      <circle cx="450" cy="500" r="3.5" fill="#F59E0B" class="density-dot" style="animation-delay:2.15s"/>
      <circle cx="780" cy="518" r="3.5" fill="#F59E0B" class="density-dot" style="animation-delay:2.0s"/>
      <circle cx="800" cy="542" r="3" fill="#F59E0B" class="density-dot" style="animation-delay:2.1s"/>
      <circle cx="750" cy="498" r="3.5" fill="#F59E0B" class="density-dot" style="animation-delay:2.15s"/>
      <circle cx="380" cy="530" r="3" fill="#F59E0B" class="density-dot" style="animation-delay:2.25s"/>
      <circle cx="820" cy="528" r="3" fill="#F59E0B" class="density-dot" style="animation-delay:2.25s"/>

      <!-- ±3σ tails — sparse -->
      <circle cx="280" cy="545" r="3" fill="#06B6D4" class="density-dot" style="animation-delay:3.4s"/>
      <circle cx="310" cy="538" r="2.5" fill="#06B6D4" class="density-dot" style="animation-delay:3.5s"/>
      <circle cx="920" cy="545" r="3" fill="#06B6D4" class="density-dot" style="animation-delay:3.4s"/>
      <circle cx="890" cy="538" r="2.5" fill="#06B6D4" class="density-dot" style="animation-delay:3.5s"/>
    </g>

    <!-- Percentage brackets and labels -->
    <!-- ±1σ bracket -->
    <path d="M480 648 H720" class="bracket" stroke="#F54E00" style="animation-delay:1.2s"/>
    <path d="M480 640 V656 M720 640 V656" class="bracket" stroke="#F54E00" style="animation-delay:1.2s"/>
    <text x="600" y="678" text-anchor="middle" class="root-text pct-label anim-t1">68%</text>
    <text x="600" y="698" text-anchor="middle" class="root-text pct-sub anim-t1">within 1σ</text>

    <!-- ±2σ bracket -->
    <path d="M360 718 H840" class="bracket" stroke="#F59E0B" style="animation-delay:2.6s"/>
    <path d="M360 710 V726 M840 710 V726" class="bracket" stroke="#F59E0B" style="animation-delay:2.6s"/>
    <text x="600" y="752" text-anchor="middle" class="root-text pct-label anim-t2" style="font-size:20px;">95%</text>
    <text x="700" y="752" text-anchor="start" class="root-text pct-sub anim-t2"> within 2σ</text>

    <!-- ±3σ label (sides) -->
    <text x="200" y="752" text-anchor="middle" class="root-text pct-label anim-t3" style="font-size:18px;fill:#06B6D4;">99.7%</text>
    <text x="200" y="772" text-anchor="middle" class="root-text pct-sub anim-t3">within 3σ</text>
  </g>

  <!-- Callout annotations -->
  <!-- Most values near center -->
  <g>
    <rect x="780" y="160" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#E8E4E0" stroke-width="1.5"
          opacity="0" style="animation:fadeIn 0.5s ease-out forwards; animation-delay:5.0s"/>
    <text x="920" y="188" text-anchor="middle" class="root-text callout anim-c1">Most values cluster</text>
    <text x="920" y="210" text-anchor="middle" class="root-text callout-sub anim-c1">near the center (mean)</text>
  </g>

  <!-- Fewer in tails -->
  <g>
    <rect x="140" y="160" width="220" height="64" rx="10" fill="#FFFFFF" stroke="#E8E4E0" stroke-width="1.5"
          opacity="0" style="animation:fadeIn 0.5s ease-out forwards; animation-delay:5.6s"/>
    <text x="250" y="188" text-anchor="middle" class="root-text callout anim-c2">Fewer values</text>
    <text x="250" y="210" text-anchor="middle" class="root-text callout-sub anim-c2">out in the tails</text>
  </g>

  <!-- Symmetry -->
  <g>
    <rect x="460" y="100" width="280" height="40" rx="8" fill="#FFFFFF" stroke="#E8E4E0" stroke-width="1.5"
          opacity="0" style="animation:fadeIn 0.5s ease-out forwards; animation-delay:6.4s"/>
    <text x="600" y="126" text-anchor="middle" class="root-text callout anim-c3">Symmetric about μ</text>
  </g>

  <!-- Symmetry arrows under the peak area -->
  <g class="sym-arrow">
    <path d="M520 250 C560 235 580 230 600 230" />
    <path d="M520 250 l12 -6 m-12 6 l10 8" />
    <path d="M680 250 C640 235 620 230 600 230" />
    <path d="M680 250 l-12 -6 m12 6 l-10 8" />
  </g>

  <!-- Legend -->
  <g transform="translate(860, 300)" opacity="0" style="animation:fadeIn 0.6s ease-out forwards; animation-delay:4.2s">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#F54E00" opacity="0.45"/>
    <text x="28" y="14" class="root-text" style="font-size:15px;font-weight:500;fill:#1F1F1F;">±1σ · common</text>
    <rect x="0" y="32" width="18" height="18" rx="3" fill="#F59E0B" opacity="0.4"/>
    <text x="28" y="46" class="root-text" style="font-size:15px;font-weight:500;fill:#1F1F1F;">±2σ · less common</text>
    <rect x="0" y="64" width="18" height="18" rx="3" fill="#06B6D4" opacity="0.35"/>
    <text x="28" y="78" class="root-text" style="font-size:15px;font-weight:500;fill:#1F1F1F;">±3σ · rare</text>
  </g>
</svg>