<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Bell curve distribution</title>
  <desc id="desc">An animated normal distribution centered on the mean, with symmetric tails and bands showing 68, 95, and 99.7 percent of values within one, two, and three standard deviations.</desc>

  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F1F1F" opacity="0.09"/>
    </pattern>

    <clipPath id="centerBand">
      <rect x="480" y="180" width="240" height="450"/>
    </clipPath>
    <clipPath id="middleBands">
      <rect x="360" y="180" width="120" height="450"/>
      <rect x="720" y="180" width="120" height="450"/>
    </clipPath>
    <clipPath id="outerBands">
      <rect x="240" y="180" width="120" height="450"/>
      <rect x="840" y="180" width="120" height="450"/>
    </clipPath>

    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6B6B6B"/>
    </marker>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#06B6D4"/>
    </marker>
    <marker id="tailArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6B6B6B"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .central-band {
      opacity: 0.28;
      animation: emphasizeCenter 1.6s ease-in-out 0.15s forwards;
    }
    .middle-band {
      opacity: 0.12;
      animation: emphasizeMiddle 1.6s ease-in-out 2.35s forwards;
    }
    .outer-band {
      opacity: 0.08;
      animation: emphasizeOuter 1.6s ease-in-out 4.55s forwards;
    }

    .center-label {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseCenter 1.3s ease-in-out 0.25s forwards;
    }

    .tail-note {
      opacity: 0.35;
      animation: revealNote 1s ease-out 4.75s forwards;
    }

    .symmetry {
      opacity: 0.18;
      animation: revealSymmetry 1s ease-out 6.75s forwards;
    }
    .symmetry-line {
      path-length: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawSymmetry 1.2s ease-out 6.75s forwards;
    }
    .mirror-point {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0.55);
      animation: popPoint 0.6s ease-out 7.35s forwards;
    }

    .active-bracket {
      path-length: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .bracket-one {
      animation: drawBracket 1s ease-out 1.15s forwards;
    }
    .bracket-two {
      animation: drawBracket 1s ease-out 3.35s forwards;
    }
    .bracket-three {
      animation: drawBracket 1s ease-out 5.55s forwards;
    }

    .rule-label {
      opacity: 0.32;
    }
    .rule-one {
      animation: activateLabel 0.8s ease-out 1.65s forwards;
    }
    .rule-two {
      animation: activateLabel 0.8s ease-out 3.85s forwards;
    }
    .rule-three {
      animation: activateLabel 0.8s ease-out 6.05s forwards;
    }

    @keyframes emphasizeCenter {
      0% { opacity: 0.28; }
      48% { opacity: 0.68; }
      100% { opacity: 0.52; }
    }
    @keyframes emphasizeMiddle {
      0% { opacity: 0.12; }
      48% { opacity: 0.48; }
      100% { opacity: 0.32; }
    }
    @keyframes emphasizeOuter {
      0% { opacity: 0.08; }
      48% { opacity: 0.40; }
      100% { opacity: 0.25; }
    }
    @keyframes pulseCenter {
      0% { transform: scale(1); }
      45% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes revealNote {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }
    @keyframes revealSymmetry {
      from { opacity: 0.18; }
      to { opacity: 1; }
    }
    @keyframes drawSymmetry {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes popPoint {
      from { transform: scale(0.55); }
      to { transform: scale(1); }
    }
    @keyframes drawBracket {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes activateLabel {
      from { opacity: 0.32; }
      to { opacity: 1; }
    }
  </style>

  <rect width="1200" height="800" fill="#FCFAF8"/>
  <rect width="1200" height="800" fill="url(#dotGrid)"/>

  <g id="heading">
    <text x="600" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#1F1F1F">The bell curve</text>
    <text x="600" y="100" text-anchor="middle" font-size="21" font-weight="500" fill="#6B6B6B">A normal distribution centered on the mean</text>
  </g>

  <g id="graph">
    <path d="M140 630
             C200 630 210 628 240 626
             C280 620 320 600 360 576
             C405 540 440 460 480 387
             C520 300 555 230 600 230
             C645 230 680 300 720 387
             C760 460 795 540 840 576
             C880 600 920 620 960 626
             C990 628 1000 630 1060 630
             L1060 630 L140 630 Z"
          fill="#F59E0B" class="outer-band" clip-path="url(#outerBands)"/>

    <path d="M140 630
             C200 630 210 628 240 626
             C280 620 320 600 360 576
             C405 540 440 460 480 387
             C520 300 555 230 600 230
             C645 230 680 300 720 387
             C760 460 795 540 840 576
             C880 600 920 620 960 626
             C990 628 1000 630 1060 630
             L1060 630 L140 630 Z"
          fill="#06B6D4" class="middle-band" clip-path="url(#middleBands)"/>

    <path d="M140 630
             C200 630 210 628 240 626
             C280 620 320 600 360 576
             C405 540 440 460 480 387
             C520 300 555 230 600 230
             C645 230 680 300 720 387
             C760 460 795 540 840 576
             C880 600 920 620 960 626
             C990 628 1000 630 1060 630
             L1060 630 L140 630 Z"
          fill="#F54E00" class="central-band" clip-path="url(#centerBand)"/>

    <line x1="140" y1="630" x2="1080" y2="630" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#axisArrow)"/>
    <line x1="140" y1="630" x2="140" y2="196" stroke="#6B6B6B" stroke-width="2.5" marker-end="url(#axisArrow)"/>

    <text x="1100" y="638" font-size="18" font-weight="500" fill="#6B6B6B">values</text>
    <text x="92" y="420" text-anchor="middle" font-size="18" font-weight="500" fill="#6B6B6B" transform="rotate(-90 92 420)">frequency</text>

    <line x1="600" y1="180" x2="600" y2="630" stroke="#F54E00" stroke-width="2.5" stroke-dasharray="7 7"/>
    <rect x="542" y="140" width="116" height="42" rx="21" fill="#FCFAF8"/>
    <text x="600" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#F54E00">mean μ</text>

    <path d="M140 630
             C200 630 210 628 240 626
             C280 620 320 600 360 576
             C405 540 440 460 480 387
             C520 300 555 230 600 230
             C645 230 680 300 720 387
             C760 460 795 540 840 576
             C880 600 920 620 960 626
             C990 628 1000 630 1060 630"
          fill="none" stroke="#1F1F1F" stroke-width="5" stroke-linecap="round"/>

    <g class="center-label">
      <rect x="510" y="305" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#F54E00" stroke-width="2"/>
      <text x="600" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#1F1F1F">most values</text>
    </g>

    <g class="tail-note">
      <text x="236" y="538" text-anchor="middle" font-size="18" font-weight="600" fill="#6B6B6B">fewer values</text>
      <path d="M230 548 Q240 579 278 603" fill="none" stroke="#6B6B6B" stroke-width="2" marker-end="url(#tailArrow)"/>

      <text x="964" y="538" text-anchor="middle" font-size="18" font-weight="600" fill="#6B6B6B">fewer values</text>
      <path d="M970 548 Q960 579 922 603" fill="none" stroke="#6B6B6B" stroke-width="2" marker-end="url(#tailArrow)"/>
    </g>

    <g class="symmetry">
      <path class="symmetry-line" pathLength="1" d="M480 387 H720" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="7 7" marker-start="url(#cyanArrow)" marker-end="url(#cyanArrow)"/>
      <circle class="mirror-point" cx="480" cy="387" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>
      <circle class="mirror-point" cx="720" cy="387" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>
      <rect x="539" y="359" width="122" height="40" rx="20" fill="#FCFAF8"/>
      <text x="600" y="385" text-anchor="middle" font-size="18" font-weight="700" fill="#0891B2">symmetric</text>
    </g>

    <g id="ticks" stroke="#6B6B6B" stroke-width="2">
      <line x1="240" y1="630" x2="240" y2="640"/>
      <line x1="360" y1="630" x2="360" y2="640"/>
      <line x1="480" y1="630" x2="480" y2="640"/>
      <line x1="600" y1="630" x2="600" y2="640"/>
      <line x1="720" y1="630" x2="720" y2="640"/>
      <line x1="840" y1="630" x2="840" y2="640"/>
      <line x1="960" y1="630" x2="960" y2="640"/>
    </g>

    <g font-size="17" font-weight="600" fill="#6B6B6B" text-anchor="middle">
      <text x="240" y="658">−3σ</text>
      <text x="360" y="658">−2σ</text>
      <text x="480" y="658">−1σ</text>
      <text x="600" y="658" fill="#F54E00">μ</text>
      <text x="720" y="658">+1σ</text>
      <text x="840" y="658">+2σ</text>
      <text x="960" y="658">+3σ</text>
    </g>
  </g>

  <g id="empirical-rule">
    <path d="M480 674 V668 M480 671 H720 M720 668 V674" fill="none" stroke="#F54E00" stroke-width="2" opacity="0.2"/>
    <path class="active-bracket bracket-one" pathLength="1" d="M480 674 V668 M480 671 H720 M720 668 V674" fill="none" stroke="#F54E00" stroke-width="4" stroke-linecap="round"/>
    <text class="rule-label rule-one" x="600" y="698" text-anchor="middle" font-size="20" font-weight="700" fill="#F54E00">68% within ±1σ</text>

    <path d="M360 712 V706 M360 709 H840 M840 706 V712" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.2"/>
    <path class="active-bracket bracket-two" pathLength="1" d="M360 712 V706 M360 709 H840 M840 706 V712" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
    <text class="rule-label rule-two" x="600" y="736" text-anchor="middle" font-size="20" font-weight="700" fill="#0891B2">95% within ±2σ</text>

    <path d="M240 750 V744 M240 747 H960 M960 744 V750" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.2"/>
    <path class="active-bracket bracket-three" pathLength="1" d="M240 750 V744 M240 747 H960 M960 744 V750" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <text class="rule-label rule-three" x="600" y="774" text-anchor="middle" font-size="20" font-weight="700" fill="#B76D00">99.7% within ±3σ</text>
  </g>
</svg>