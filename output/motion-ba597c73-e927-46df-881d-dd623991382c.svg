<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(31,31,31,0.10)" />
    </pattern>
    <clipPath id="curveClip">
      <path d="M150,620 L150,615.8 L180,612.5 L210,607.1 L240,598.7 L270,586.2 L300,568.6 L330,544.8 L360,514.4 L390,477.4 L420,435.0 L450,389.5 L480,344.1 L510,302.6 L540,269.2 L570,247.5 L600,240 L630,247.5 L660,269.2 L690,302.6 L720,344.1 L750,389.5 L780,435.0 L810,477.4 L840,514.4 L870,544.8 L900,568.6 L930,586.2 L960,598.7 L990,607.1 L1020,612.5 L1050,615.8 L1050,620 Z" />
    </clipPath>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6B6B6B" />
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .curve {
      fill: none;
      stroke: #1F1F1F;
      stroke-width: 3.5;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.4s ease-in-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .band { opacity: 0; animation: fadeIn 0.7s ease-out forwards; }
    .bandLabel { opacity: 0; animation: fadeIn 0.6s ease-out forwards; }
    .sigLine { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }

    .b-center { animation-delay: 1.8s; }
    .b-mid    { animation-delay: 2.8s; }
    .b-outer  { animation-delay: 3.8s; }

    .l-center { animation-delay: 2.2s; }
    .l-mid    { animation-delay: 3.2s; }
    .l-outer  { animation-delay: 4.2s; }

    .sl-1 { animation-delay: 1.8s; }
    .sl-2 { animation-delay: 2.8s; }
    .sl-3 { animation-delay: 3.8s; }

    .mean { opacity: 0; animation: fadeIn 0.6s ease-out forwards; animation-delay: 1.4s; }
    .symGroup { opacity: 0; animation: fadeIn 0.8s ease-out forwards; animation-delay: 5.0s; }

    @keyframes fadeIn { to { opacity: 1; } }

    .pctText { font-weight: 700; }
  </style>

  <!-- background -->
  <rect width="1200" height="800" fill="#FCFAF8" />
  <rect width="1200" height="800" fill="url(#dotGrid)" />

  <!-- titles -->
  <text x="600" y="66" text-anchor="middle" font-size="38" font-weight="700" fill="#1F1F1F">The Normal Distribution</text>
  <text x="600" y="102" text-anchor="middle" font-size="21" font-weight="500" fill="#6B6B6B">Most values cluster near the mean — fewer appear toward the tails</text>

  <!-- colored bands under curve -->
  <g clip-path="url(#curveClip)">
    <rect class="band b-outer" x="150" y="240" width="150" height="380" fill="#F59E0B" opacity="0" />
    <rect class="band b-outer" x="900" y="240" width="150" height="380" fill="#F59E0B" opacity="0" />
    <rect class="band b-mid" x="300" y="240" width="150" height="380" fill="#06B6D4" opacity="0" />
    <rect class="band b-mid" x="750" y="240" width="150" height="380" fill="#06B6D4" opacity="0" />
    <rect class="band b-center" x="450" y="240" width="300" height="380" fill="#22C55E" opacity="0" />
  </g>

  <!-- sigma boundary lines -->
  <g stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="5 5">
    <line class="sigLine sl-1" x1="450" y1="620" x2="450" y2="389.5" />
    <line class="sigLine sl-1" x1="750" y1="620" x2="750" y2="389.5" />
    <line class="sigLine sl-2" x1="300" y1="620" x2="300" y2="568.6" />
    <line class="sigLine sl-2" x1="900" y1="620" x2="900" y2="568.6" />
    <line class="sigLine sl-3" x1="150" y1="620" x2="150" y2="615.8" />
    <line class="sigLine sl-3" x1="1050" y1="620" x2="1050" y2="615.8" />
  </g>

  <!-- mean line -->
  <g class="mean">
    <line x1="600" y1="620" x2="600" y2="240" stroke="#F54E00" stroke-width="2.5" stroke-dasharray="6 5" />
    <text x="600" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#F54E00">μ (mean)</text>
  </g>

  <!-- curve -->
  <path class="curve" pathLength="1" d="M150,615.8 L180,612.5 L210,607.1 L240,598.7 L270,586.2 L300,568.6 L330,544.8 L360,514.4 L390,477.4 L420,435.0 L450,389.5 L480,344.1 L510,302.6 L540,269.2 L570,247.5 L600,240 L630,247.5 L660,269.2 L690,302.6 L720,344.1 L750,389.5 L780,435.0 L810,477.4 L840,514.4 L870,544.8 L900,568.6 L930,586.2 L960,598.7 L990,607.1 L1020,612.5 L1050,615.8" />

  <!-- x axis -->
  <line x1="120" y1="620" x2="1080" y2="620" stroke="#6B6B6B" stroke-width="2" />
  <g font-size="18" font-weight="500" fill="#6B6B6B" text-anchor="middle">
    <text x="150" y="648">−3σ</text>
    <text x="300" y="648">−2σ</text>
    <text x="450" y="648">−1σ</text>
    <text x="600" y="648">μ</text>
    <text x="750" y="648">+1σ</text>
    <text x="900" y="648">+2σ</text>
    <text x="1050" y="648">+3σ</text>
  </g>

  <!-- percentage labels -->
  <g class="pctText" text-anchor="middle" paint-order="stroke" stroke="#FCFAF8" stroke-width="4" fill="#1F1F1F" font-size="26">
    <text class="bandLabel l-center" x="600" y="470">68.2%</text>
  </g>
  <g class="pctText" text-anchor="middle" paint-order="stroke" stroke="#FCFAF8" stroke-width="4" fill="#1F1F1F" font-size="19">
    <text class="bandLabel l-mid" x="375" y="548">13.6%</text>
    <text class="bandLabel l-mid" x="825" y="548">13.6%</text>
    <text class="bandLabel l-outer" x="225" y="600">2.1%</text>
    <text class="bandLabel l-outer" x="975" y="600">2.1%</text>
  </g>

  <!-- symmetry indicator -->
  <g class="symGroup">
    <line x1="600" y1="705" x2="330" y2="705" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrowHead)" />
    <line x1="600" y1="705" x2="870" y2="705" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrowHead)" />
    <text x="600" y="712" text-anchor="middle" font-size="20" font-weight="700" paint-order="stroke" stroke="#FCFAF8" stroke-width="5" fill="#1F1F1F">symmetric about the mean</text>
    <text x="600" y="756" text-anchor="middle" font-size="18" font-weight="500" fill="#6B6B6B">Within 1σ: 68% · within 2σ: 95% · within 3σ: 99.7% of all values</text>
  </g>
</svg>