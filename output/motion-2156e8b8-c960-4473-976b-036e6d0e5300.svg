<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-rendering="geometricPrecision">
  <style>
    .title { font-size: 32px; font-weight: 700; fill: #1F1F1F; }
    .subtitle { font-size: 17px; font-weight: 400; fill: #6B6B6B; }
    .axislabel { font-size: 15px; font-weight: 500; fill: #6B6B6B; }
    .mulabel { font-size: 17px; font-weight: 600; fill: #1F1F1F; }
    .pct { font-size: 18px; font-weight: 600; fill: #F54E00; }
    .pctsub { font-size: 12px; font-weight: 400; fill: #6B6B6B; }
    .sym { font-size: 15px; font-weight: 500; fill: #1F1F1F; letter-spacing: 0.3px; }

    .bar {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: growBar 0.75s ease-out forwards;
      transform: scaleY(0);
    }
    @keyframes growBar { to { transform: scaleY(1); } }

    .curve-line {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawCurve 1.1s ease-out 0.3s forwards;
    }
    @keyframes drawCurve { to { stroke-dashoffset: 0; } }

    .reveal { opacity: 0; animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .bar { transform: scaleY(1); animation: none; }
      .curve-line { stroke-dashoffset: 0; animation: none; }
      .reveal { opacity: 1; animation: none; }
    }
  </style>

  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(31,31,31,0.10)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FCFAF8" />
  <rect width="1200" height="800" fill="url(#dotGrid)" />

  <!-- Title -->
  <text class="title" x="600" y="70" text-anchor="middle">The Bell Curve</text>
  <text class="subtitle" x="600" y="100" text-anchor="middle">Normal distribution — values cluster near the mean, thinning symmetrically into the tails</text>

  <!-- Plot group -->
  <g id="plot">

    <!-- Faint curve area (establishing shape, behind bars) -->
    <path d="M 200 560 L 200 559.5 L 220 559.1 L 240 558.3 L 260 557 L 280 554.8 L 300 551.3 L 320 545.9 L 340 537.9 L 360 526.7 L 380 511.3 L 400 491.1 L 420 465.7 L 440 435 L 460 399.8 L 480 361.4 L 500 321.9 L 520 283.7 L 540 249.8 L 560 223 L 580 206.1 L 600 200 L 620 206.1 L 640 223 L 660 249.8 L 680 283.7 L 700 321.9 L 720 361.4 L 740 399.8 L 760 435 L 780 465.7 L 800 491.1 L 820 511.3 L 840 526.7 L 860 537.9 L 880 545.9 L 900 551.3 L 920 554.8 L 940 557 L 960 558.3 L 980 559.1 L 1000 559.5 L 1000 560 Z"
      fill="#F54E00" fill-opacity="0.08" />

    <!-- Standard deviation vertical guides -->
    <g stroke="#6B6B6B" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4">
      <line x1="270" y1="560" x2="270" y2="556" />
      <line x1="380" y1="560" x2="380" y2="511.3" />
      <line x1="490" y1="560" x2="490" y2="341.7" />
      <line x1="710" y1="560" x2="710" y2="341.7" />
      <line x1="820" y1="560" x2="820" y2="511.3" />
      <line x1="930" y1="560" x2="930" y2="556" />
    </g>
    <!-- Mean vertical guide (stronger) -->
    <line x1="600" y1="560" x2="600" y2="200" stroke="#1F1F1F" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Baseline -->
    <line x1="180" y1="560" x2="1020" y2="560" stroke="#6B6B6B" stroke-width="1.5" />

    <!-- Tick marks -->
    <g stroke="#6B6B6B" stroke-width="1.5">
      <line x1="270" y1="560" x2="270" y2="567" />
      <line x1="380" y1="560" x2="380" y2="567" />
      <line x1="490" y1="560" x2="490" y2="567" />
      <line x1="600" y1="560" x2="600" y2="567" />
      <line x1="710" y1="560" x2="710" y2="567" />
      <line x1="820" y1="560" x2="820" y2="567" />
      <line x1="930" y1="560" x2="930" y2="567" />
    </g>

    <!-- Histogram bars (data clustering), staggered center outward -->
    <g id="bars">
      <!-- 3σ band (outer, lightest) -->
      <rect class="bar" x="262"  y="554.77" width="36" height="5.23"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.98s" />
      <rect class="bar" x="302"  y="545.9"  width="36" height="14.1"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.92s" />
      <rect class="bar" x="342"  y="526.7"  width="36" height="33.3"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.86s" />
      <!-- 2σ band (medium) -->
      <rect class="bar" x="382"  y="491.1"  width="36" height="68.9"  rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.80s" />
      <rect class="bar" x="422"  y="435"    width="36" height="125"   rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.74s" />
      <rect class="bar" x="462"  y="361.4"  width="36" height="198.6" rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.68s" />
      <!-- 1σ band (center, darkest) -->
      <rect class="bar" x="502"  y="283.7"  width="36" height="276.3" rx="2" fill="#F54E00" fill-opacity="0.55" style="animation-delay:0.62s" />
      <rect class="bar" x="542"  y="223"    width="36" height="337"   rx="2" fill="#F54E00" fill-opacity="0.55" style="animation-delay:0.56s" />
      <rect class="bar" x="582"  y="200"    width="36" height="360"   rx="2" fill="#F54E00" fill-opacity="0.55" style="animation-delay:0.50s" />
      <rect class="bar" x="622"  y="223"    width="36" height="337"   rx="2" fill="#F54E00" fill-opacity="0.55" style="animation-delay:0.56s" />
      <rect class="bar" x="662"  y="283.7"  width="36" height="276.3" rx="2" fill="#F54E00" fill-opacity="0.55" style="animation-delay:0.62s" />
      <!-- 2σ band (right) -->
      <rect class="bar" x="702"  y="361.4"  width="36" height="198.6" rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.68s" />
      <rect class="bar" x="742"  y="435"    width="36" height="125"   rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.74s" />
      <rect class="bar" x="782"  y="491.1"  width="36" height="68.9"  rx="2" fill="#F54E00" fill-opacity="0.32" style="animation-delay:0.80s" />
      <!-- 3σ band (right) -->
      <rect class="bar" x="822"  y="526.7"  width="36" height="33.3"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.86s" />
      <rect class="bar" x="862"  y="545.9"  width="36" height="14.1"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.92s" />
      <rect class="bar" x="902"  y="554.77" width="36" height="5.23"  rx="2" fill="#F54E00" fill-opacity="0.18" style="animation-delay:0.98s" />
    </g>

    <!-- Bell curve outline (draws over bars) -->
    <path class="curve-line" pathLength="1"
      d="M 200 559.5 L 220 559.1 L 240 558.3 L 260 557 L 280 554.8 L 300 551.3 L 320 545.9 L 340 537.9 L 360 526.7 L 380 511.3 L 400 491.1 L 420 465.7 L 440 435 L 460 399.8 L 480 361.4 L 500 321.9 L 520 283.7 L 540 249.8 L 560 223 L 580 206.1 L 600 200 L 620 206.1 L 640 223 L 660 249.8 L 680 283.7 L 700 321.9 L 720 361.4 L 740 399.8 L 760 435 L 780 465.7 L 800 491.1 L 820 511.3 L 840 526.7 L 860 537.9 L 880 545.9 L 900 551.3 L 920 554.8 L 940 557 L 960 558.3 L 980 559.1 L 1000 559.5"
      fill="none" stroke="#F54E00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Axis labels -->
    <g>
      <text class="mulabel"    x="600" y="590" text-anchor="middle">μ</text>
      <text class="axislabel"  x="490" y="590" text-anchor="middle">μ−σ</text>
      <text class="axislabel"  x="710" y="590" text-anchor="middle">μ+σ</text>
      <text class="axislabel"  x="380" y="590" text-anchor="middle">μ−2σ</text>
      <text class="axislabel"  x="820" y="590" text-anchor="middle">μ+2σ</text>
      <text class="axislabel"  x="270" y="590" text-anchor="middle">μ−3σ</text>
      <text class="axislabel"  x="930" y="590" text-anchor="middle">μ+3σ</text>
    </g>

    <!-- Standard deviation bands with percentages (68-95-99.7) -->
    <g fill="none" stroke="#6B6B6B" stroke-width="1.5">
      <!-- 68% bracket -->
      <path class="reveal" style="animation-delay:2.0s" d="M 490 622 L 490 628 M 490 622 L 710 622 M 710 622 L 710 628" />
      <!-- 95% bracket -->
      <path class="reveal" style="animation-delay:2.3s" d="M 380 666 L 380 672 M 380 666 L 820 666 M 820 666 L 820 672" />
      <!-- 99.7% bracket -->
      <path class="reveal" style="animation-delay:2.6s" d="M 270 710 L 270 716 M 270 710 L 930 710 M 930 710 L 930 716" />
    </g>
    <g text-anchor="middle">
      <text class="pct reveal" x="600" y="648" style="animation-delay:2.0s">68%</text>
      <text class="pctsub reveal" x="600" y="662" style="animation-delay:2.0s">within 1 standard deviation</text>

      <text class="pct reveal" x="600" y="692" style="animation-delay:2.3s">95%</text>
      <text class="pctsub reveal" x="600" y="706" style="animation-delay:2.3s">within 2 standard deviations</text>

      <text class="pct reveal" x="600" y="736" style="animation-delay:2.6s">99.7%</text>
      <text class="pctsub reveal" x="600" y="750" style="animation-delay:2.6s">within 3 standard deviations</text>
    </g>

    <!-- Symmetry indicator -->
    <g class="reveal" style="animation-delay:3.4s">
      <path d="M 388 770 L 380 770 L 380 770 M 380 770 L 820 770 M 812 766 L 820 770 L 812 774 M 388 766 L 380 770 L 388 774"
        fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text class="sym" x="600" y="792" text-anchor="middle">Symmetric about the mean</text>
    </g>

  </g>
</svg>