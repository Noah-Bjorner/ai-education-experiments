<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">The three branches of the United States government</title>
  <desc id="desc">Three pillars show the Legislative, Executive, and Judicial branches performing their roles, followed by animated arrows illustrating congressional oversight, presidential vetoes, and judicial review.</desc>

  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F1F1F" opacity="0.1"/>
    </pattern>

    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F97316"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .pillar-outline {
      fill: #FFFFFF;
      stroke: #6B6B6B;
      stroke-width: 2;
    }

    .flute {
      stroke: #D7D1CB;
      stroke-width: 2;
    }

    .branch-name {
      fill: #1F1F1F;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-anchor: middle;
    }

    .branch-person {
      fill: #6B6B6B;
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
    }

    .action-label {
      fill: #1F1F1F;
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
    }

    .action-sub {
      fill: #6B6B6B;
      font-size: 16px;
      font-weight: 500;
      text-anchor: middle;
    }

    .check-ghost {
      fill: none;
      stroke: #6B6B6B;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.13;
    }

    .check-path {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .oversight-path {
      stroke: #22C55E;
      marker-end: url(#arrowGreen);
      animation: drawCheck 1.25s ease-out 4.2s forwards;
    }

    .veto-path {
      stroke: #F97316;
      marker-end: url(#arrowOrange);
      animation: drawCheck 1.25s ease-out 5.9s forwards;
    }

    .review-path {
      stroke: #06B6D4;
      marker-end: url(#arrowCyan);
      animation: drawCheck 1.5s ease-out 7.6s forwards;
    }

    .check-label {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .oversight-label {
      animation: labelReveal 0.5s ease-out 5.05s forwards;
    }

    .veto-label {
      animation: labelReveal 0.5s ease-out 6.75s forwards;
    }

    .review-label {
      animation: labelReveal 0.5s ease-out 8.65s forwards;
    }

    .law-stamp {
      opacity: 0.28;
      transform: scale(0.86) rotate(-7deg);
      transform-box: fill-box;
      transform-origin: center;
      animation: stampLaw 0.7s cubic-bezier(.2,.9,.3,1.2) 0.25s forwards;
    }

    .exec-shield {
      transform-box: fill-box;
      transform-origin: center;
      animation: shieldPulse 0.9s ease-out 1.45s forwards;
    }

    .checkmark {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawCheck 0.65s ease-out 1.65s forwards;
    }

    .balance {
      transform: rotate(-8deg);
      transform-box: fill-box;
      transform-origin: center;
      animation: balanceScale 1.1s ease-in-out 2.7s forwards;
    }

    .final-note {
      opacity: 0;
      animation: noteReveal 0.65s ease-out 9.25s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    @keyframes labelReveal {
      from { opacity: 0; transform: translateY(5px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes stampLaw {
      0% { opacity: 0.28; transform: scale(1.25) rotate(-7deg); }
      70% { opacity: 1; transform: scale(0.96) rotate(-7deg); }
      100% { opacity: 1; transform: scale(1) rotate(-7deg); }
    }

    @keyframes shieldPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes balanceScale {
      0% { transform: rotate(-8deg); }
      55% { transform: rotate(3deg); }
      78% { transform: rotate(-1.5deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes noteReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FCFAF8"/>
  <rect width="1200" height="800" fill="url(#dotGrid)"/>

  <!-- Heading -->
  <text x="600" y="54" fill="#1F1F1F" font-size="36" font-weight="800" text-anchor="middle">
    U.S. GOVERNMENT: THREE BRANCHES
  </text>
  <text x="600" y="94" fill="#6B6B6B" font-size="21" font-weight="500" text-anchor="middle">
    Each branch has a distinct job—and checks the power of the others.
  </text>

  <!-- Faint check-and-balance routes -->
  <path class="check-ghost" d="M325 238 C405 176 490 176 565 238"/>
  <path class="check-ghost" d="M545 640 C485 714 390 714 325 640"/>
  <path class="check-ghost" d="M880 230 C755 116 470 116 325 230"/>

  <!-- Legislative pillar -->
  <g id="legislative">
    <path d="M120 280 L245 226 L370 280 Z" fill="#FFF4EE" stroke="#F54E00" stroke-width="3"/>
    <rect x="132" y="280" width="226" height="40" rx="3" class="pillar-outline"/>
    <rect x="144" y="320" width="202" height="300" class="pillar-outline"/>
    <rect x="132" y="620" width="226" height="30" rx="3" class="pillar-outline"/>
    <rect x="120" y="650" width="250" height="18" rx="4" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="2"/>

    <line x1="166" y1="334" x2="166" y2="606" class="flute"/>
    <line x1="182" y1="334" x2="182" y2="606" class="flute"/>
    <line x1="308" y1="334" x2="308" y2="606" class="flute"/>
    <line x1="324" y1="334" x2="324" y2="606" class="flute"/>

    <text x="245" y="271" class="branch-name">LEGISLATIVE</text>
    <text x="245" y="307" class="branch-person">Congress</text>

    <!-- Document -->
    <path d="M204 370 H274 L294 390 V500 H204 Z" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="3"/>
    <path d="M274 370 V390 H294" fill="none" stroke="#6B6B6B" stroke-width="3"/>
    <line x1="221" y1="407" x2="278" y2="407" stroke="#979797" stroke-width="3" stroke-linecap="round"/>
    <line x1="221" y1="424" x2="278" y2="424" stroke="#979797" stroke-width="3" stroke-linecap="round"/>
    <line x1="221" y1="441" x2="266" y2="441" stroke="#979797" stroke-width="3" stroke-linecap="round"/>

    <g class="law-stamp">
      <rect x="216" y="456" width="69" height="31" rx="5" fill="#FFF4EE" stroke="#F54E00" stroke-width="3"/>
      <text x="250.5" y="478" fill="#F54E00" font-size="19" font-weight="800" text-anchor="middle">LAW</text>
    </g>

    <text x="245" y="550" class="action-label">Makes laws</text>
    <text x="245" y="579" class="action-sub">writes and passes bills</text>
  </g>

  <!-- Executive pillar -->
  <g id="executive">
    <path d="M475 280 L600 226 L725 280 Z" fill="#FFF7E6" stroke="#F59E0B" stroke-width="3"/>
    <rect x="487" y="280" width="226" height="40" rx="3" class="pillar-outline"/>
    <rect x="499" y="320" width="202" height="300" class="pillar-outline"/>
    <rect x="487" y="620" width="226" height="30" rx="3" class="pillar-outline"/>
    <rect x="475" y="650" width="250" height="18" rx="4" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="2"/>

    <line x1="521" y1="334" x2="521" y2="606" class="flute"/>
    <line x1="537" y1="334" x2="537" y2="606" class="flute"/>
    <line x1="663" y1="334" x2="663" y2="606" class="flute"/>
    <line x1="679" y1="334" x2="679" y2="606" class="flute"/>

    <text x="600" y="271" class="branch-name">EXECUTIVE</text>
    <text x="600" y="307" class="branch-person">President</text>

    <!-- Enforcement shield -->
    <g class="exec-shield">
      <path d="M600 368 L650 386 V428 C650 465 628 489 600 505 C572 489 550 465 550 428 V386 Z"
            fill="#FFF7E6" stroke="#F59E0B" stroke-width="4"/>
      <circle cx="600" cy="426" r="29" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
      <path class="checkmark" pathLength="1" d="M584 426 L596 439 L619 411"
            fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="600" y="550" class="action-label">Enforces laws</text>
    <text x="600" y="579" class="action-sub">carries laws into action</text>
  </g>

  <!-- Judicial pillar -->
  <g id="judicial">
    <path d="M830 280 L955 226 L1080 280 Z" fill="#EAFBFE" stroke="#06B6D4" stroke-width="3"/>
    <rect x="842" y="280" width="226" height="40" rx="3" class="pillar-outline"/>
    <rect x="854" y="320" width="202" height="300" class="pillar-outline"/>
    <rect x="842" y="620" width="226" height="30" rx="3" class="pillar-outline"/>
    <rect x="830" y="650" width="250" height="18" rx="4" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="2"/>

    <line x1="876" y1="334" x2="876" y2="606" class="flute"/>
    <line x1="892" y1="334" x2="892" y2="606" class="flute"/>
    <line x1="1018" y1="334" x2="1018" y2="606" class="flute"/>
    <line x1="1034" y1="334" x2="1034" y2="606" class="flute"/>

    <text x="955" y="271" class="branch-name">JUDICIAL</text>
    <text x="955" y="307" class="branch-person">Supreme Court</text>

    <!-- Scales -->
    <line x1="955" y1="385" x2="955" y2="490" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="955" cy="382" r="8" fill="#06B6D4"/>
    <path d="M925 500 H985" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"/>

    <g class="balance">
      <path d="M895 410 H1015" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
      <circle cx="955" cy="410" r="7" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>

      <line x1="910" y1="410" x2="892" y2="455" stroke="#6B6B6B" stroke-width="3"/>
      <line x1="910" y1="410" x2="928" y2="455" stroke="#6B6B6B" stroke-width="3"/>
      <path d="M884 455 Q910 478 936 455 Z" fill="#EAFBFE" stroke="#06B6D4" stroke-width="3"/>

      <line x1="1000" y1="410" x2="982" y2="455" stroke="#6B6B6B" stroke-width="3"/>
      <line x1="1000" y1="410" x2="1018" y2="455" stroke="#6B6B6B" stroke-width="3"/>
      <path d="M974 455 Q1000 478 1026 455 Z" fill="#EAFBFE" stroke="#06B6D4" stroke-width="3"/>
    </g>

    <text x="955" y="550" class="action-label">Interprets laws</text>
    <text x="955" y="579" class="action-sub">decides what laws mean</text>
  </g>

  <!-- Animated checks and balances -->
  <path class="check-path oversight-path" pathLength="1" d="M325 238 C405 176 490 176 565 238"/>
  <path class="check-path veto-path" pathLength="1" d="M545 640 C485 714 390 714 325 640"/>
  <path class="check-path review-path" pathLength="1" d="M880 230 C755 116 470 116 325 230"/>

  <!-- Labels for checks -->
  <g class="check-label oversight-label">
    <rect x="365" y="174" width="166" height="38" rx="19" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
    <text x="448" y="199" fill="#168A3D" font-size="17" font-weight="700" text-anchor="middle">OVERSIGHT</text>
  </g>

  <g class="check-label veto-label">
    <rect x="370" y="684" width="142" height="38" rx="19" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
    <text x="441" y="709" fill="#C54E08" font-size="17" font-weight="700" text-anchor="middle">VETO</text>
  </g>

  <g class="check-label review-label">
    <rect x="515" y="125" width="204" height="38" rx="19" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
    <text x="617" y="150" fill="#07869B" font-size="17" font-weight="700" text-anchor="middle">JUDICIAL REVIEW</text>
  </g>

  <!-- Final visual conclusion -->
  <g class="final-note">
    <circle cx="600" cy="750" r="5" fill="#F54E00"/>
    <text x="600" y="757" fill="#1F1F1F" font-size="20" font-weight="700" text-anchor="middle">
      <tspan x="600">Power is shared—not held by one branch.</tspan>
    </text>
  </g>
</svg>