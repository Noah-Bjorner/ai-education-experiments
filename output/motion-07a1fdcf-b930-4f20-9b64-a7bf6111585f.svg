<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(31,31,31,0.08)" />
    </pattern>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="band1Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="band2Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="band3Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #FCFAF8; }
    .dot { fill: url(#dotGrid); }
    .axis { stroke: #6B6B6B; stroke-width: 1.5; }
    .tick { stroke: #6B6B6B; stroke-width: 1; }
    .curveLine { fill: none; stroke: #06B6D4; stroke-width: 3; stroke-linecap: round; }
    .curveArea { fill: url(#curveFill); stroke: none; }
    .band1 { fill: url(#band1Fill); stroke: none; }
    .band2 { fill: url(#band2Fill); stroke: none; }
    .band3 { fill: url(#band3Fill); stroke: none; }
    .meanLine { stroke: #F54E00; stroke-width: 2; stroke-dasharray: 8 4; }
    .sdLine { stroke: #979797; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; fill: #1F1F1F; }
    .labelSmall { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; fill: #6B6B6B; }
    .labelBold { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; }
    .pctText { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; fill: #FFFFFF; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 700; fill: #1F1F1F; }
    .explain { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; fill: #6B6B6B; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drawCurve { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
    @keyframes scaleBand { from { opacity: 0; transform: scaleY(0); transform-origin: bottom; } to { opacity: 1; transform: scaleY(1); transform-origin: bottom; } }
    @keyframes showLabel { from { opacity: 0; } to { opacity: 1; } }

    .animFade { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
    .animSlide { animation: slideUp 0.6s ease-out forwards; opacity: 0; }
    .animBand { animation: scaleBand 0.7s ease-out forwards; opacity: 0; transform-origin: bottom center; }
    .animLabel { animation: showLabel 0.5s ease-out forwards; opacity: 0; }

    .d0 { animation-delay: 0.2s; }
    .d1 { animation-delay: 1.0s; }
    .d2 { animation-delay: 2.2s; }
    .d3 { animation-delay: 3.4s; }
    .d4 { animation-delay: 4.6s; }
    .d5 { animation-delay: 5.8s; }
    .d6 { animation-delay: 7.0s; }
  </style>

  <rect width="1200" height="800" class="bg" />
  <rect width="1200" height="800" class="dot" />

  <!-- Left explanation panel -->
  <g transform="translate(60, 120)">
    <text class="title" font-size="36" x="0" y="0">Normal Distribution</text>
    <text class="explain" font-size="20" x="0" y="40" class="animSlide d0">The bell curve shape</text>

    <g class="animFade d1" transform="translate(0, 90)">
      <circle cx="8" cy="-6" r="6" fill="#06B6D4" />
      <text class="label" font-size="18" x="22" y="0">Clustered near center</text>
    </g>
    <g class="animFade d2" transform="translate(0, 125)">
      <circle cx="8" cy="-6" r="6" fill="#3B82F6" />
      <text class="label" font-size="18" x="22" y="0">Sparse in the tails</text>
    </g>
    <g class="animFade d3" transform="translate(0, 160)">
      <circle cx="8" cy="-6" r="6" fill="#8B5CF6" />
      <text class="label" font-size="18" x="22" y="0">Perfect symmetry</text>
    </g>

    <g class="animSlide d4" transform="translate(0, 240)">
      <text class="labelBold" font-size="22" fill="#F54E00">68% within 1σ</text>
      <text class="labelSmall" font-size="16" x="0" y="25">~2/3 of all data</text>
    </g>
    <g class="animSlide d5" transform="translate(0, 290)">
      <text class="labelBold" font-size="22" fill="#3B82F6">95% within 2σ</text>
      <text class="labelSmall" font-size="16" x="0" y="25">Almost all typical values</text>
    </g>
    <g class="animSlide d6" transform="translate(0, 340)">
      <text class="labelBold" font-size="22" fill="#8B5CF6">99.7% within 3σ</text>
      <text class="labelSmall" font-size="16" x="0" y="25">Extremely rare outside</text>
    </g>
  </g>

  <!-- Chart Area -->
  <g transform="translate(450, 100)">
    <!-- Base axis -->
    <line x1="0" y1="500" x2="700" y2="500" class="axis" />
    <line x1="350" y1="50" x2="350" y2="500" class="meanLine" class="animFade d0" />

    <!-- Band 3 (outer, 3σ) -->
    <path d="M 50 500 L 50 480 Q 50 350 150 280 T 250 180 T 350 120 Q 350 40 450 120 T 550 180 T 650 280 Q 650 350 650 500 Z" class="band3 animBand d1" />

    <!-- Band 2 (middle, 2σ) -->
    <path d="M 150 500 L 150 480 Q 150 380 200 320 T 250 230 T 350 150 Q 350 70 450 150 T 500 230 T 550 320 Q 550 380 550 500 Z" class="band2 animBand d2" />

    <!-- Band 1 (inner, 1σ) -->
    <path d="M 250 500 L 250 480 Q 250 400 275 350 T 325 280 T 350 220 Q 350 120 450 220 T 475 280 T 525 350 Q 525 400 550 500 Z" class="band1 animBand d3" />

    <!-- Curve outline -->
    <path d="M 50 490 Q 120 480 150 400 T 200 300 T 250 220 T 300 130 T 350 80 Q 400 130 450 220 T 500 300 T 550 400 T 600 480 Q 620 490 650 490" class="curveLine" stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="2s" fill="freeze" calcMode="easeOut" />
    </path>

    <!-- Fill under curve -->
    <path d="M 50 500 L 50 490 Q 120 480 150 400 T 200 300 T 250 220 T 300 130 T 350 80 Q 400 130 450 220 T 500 300 T 550 400 T 600 480 Q 620 490 650 490 L 650 500 Z" class="curveArea" class="animFade d0" />

    <!-- SD lines and ticks -->
    <line x1="250" y1="500" x2="250" y2="510" class="tick animFade d4" />
    <line x1="450" y1="500" x2="450" y2="510" class="tick animFade d4" />
    <line x1="150" y1="500" x2="150" y2="510" class="tick animFade d5" />
    <line x1="550" y1="500" x2="550" y2="510" class="tick animFade d5" />
    <line x1="50" y1="500" x2="50" y2="510" class="tick animFade d6" />
    <line x1="650" y1="500" x2="650" y2="510" class="tick animFade d6" />

    <line x1="250" y1="500" x2="250" y2="180" class="sdLine animFade d4" />
    <line x1="450" y1="500" x2="450" y2="180" class="sdLine animFade d4" />
    <line x1="150" y1="500" x2="150" y2="280" class="sdLine animFade d5" />
    <line x1="550" y1="500" x2="550" y2="280" class="sdLine animFade d5" />
    <line x1="50" y1="500" x2="50" y2="350" class="sdLine animFade d6" />
    <line x1="650" y1="500" x2="650" y2="350" class="sdLine animFade d6" />

    <!-- Axis labels -->
    <text class="labelSmall" font-size="14" x="350" y="530" text-anchor="middle" class="animFade d0">Mean (0)</text>
    <text class="labelSmall" font-size="13" x="250" y="525" text-anchor="middle" class="animFade d4">-1σ</text>
    <text class="labelSmall" font-size="13" x="450" y="525" text-anchor="middle" class="animFade d4">+1σ</text>
    <text class="labelSmall" font-size="13" x="150" y="525" text-anchor="middle" class="animFade d5">-2σ</text>
    <text class="labelSmall" font-size="13" x="550" y="525" text-anchor="middle" class="animFade d5">+2σ</text>
    <text class="labelSmall" font-size="13" x="50" y="525" text-anchor="middle" class="animFade d6">-3σ</text>
    <text class="labelSmall" font-size="13" x="650" y="525" text-anchor="middle" class="animFade d6">+3σ</text>

    <!-- Percentage labels in bands -->
    <g class="animLabel d4">
      <rect x="320" y="240" width="60" height="30" rx="6" fill="rgba(6,182,212,0.85)" />
      <text class="pctText" font-size="14" x="350" y="260" text-anchor="middle">68%</text>
    </g>
    <g class="animLabel d5">
      <rect x="200" y="300" width="60" height="30" rx="6" fill="rgba(59,130,246,0.85)" />
      <text class="pctText" font-size="14" x="230" y="320" text-anchor="middle">95%</text>
      <rect x="420" y="300" width="60" height="30" rx="6" fill="rgba(59,130,246,0.85)" />
      <text class="pctText" font-size="14" x="450" y="320" text-anchor="middle">95%</text>
    </g>
    <g class="animLabel d6">
      <rect x="90" y="360" width="60" height="30" rx="6" fill="rgba(139,92,246,0.85)" />
      <text class="pctText" font-size="13" x="120" y="380" text-anchor="middle">99.7%</text>
      <rect x="530" y="360" width="60" height="30" rx="6" fill="rgba(139,92,246,0.85)" />
      <text class="pctText" font-size="13" x="560" y="380" text-anchor="middle">99.7%</text>
    </g>
  </g>
</svg>