<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">The long-term population effect of a total fertility rate of 1.5</title>
  <desc id="desc">A generational bar chart starts with 100 people and shows successive generation sizes of 75, 56, 42, 32, and 24 people. With an equal sex ratio, each generation is approximately 75 percent as large as the previous generation.</desc>

  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F1F1F" opacity="0.09"/>
    </pattern>
    <marker id="trendArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .axis {
      stroke: #6B6B6B;
      stroke-width: 2;
    }

    .gridline {
      stroke: #6B6B6B;
      stroke-width: 1;
      stroke-dasharray: 4 7;
      opacity: 0.24;
    }

    .bar {
      fill: #FDE4D8;
      stroke: #F54E00;
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: center;
    }

    .bar.g0 { animation: barFocus 1.1s ease-in-out 0.15s both; }
    .bar.g1 { animation: barFocus 1.1s ease-in-out 1.05s both; }
    .bar.g2 { animation: barFocus 1.1s ease-in-out 1.95s both; }
    .bar.g3 { animation: barFocus 1.1s ease-in-out 2.85s both; }
    .bar.g4 { animation: barFocus 1.1s ease-in-out 3.75s both; }
    .bar.g5 { animation: barFocus 1.1s ease-in-out 4.65s both; }

    .ratio-chip {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ratio-chip.c1 { animation: chipReveal 0.45s ease-out 0.75s forwards; }
    .ratio-chip.c2 { animation: chipReveal 0.45s ease-out 1.65s forwards; }
    .ratio-chip.c3 { animation: chipReveal 0.45s ease-out 2.55s forwards; }
    .ratio-chip.c4 { animation: chipReveal 0.45s ease-out 3.45s forwards; }
    .ratio-chip.c5 { animation: chipReveal 0.45s ease-out 4.35s forwards; }

    .trend-draw {
      fill: none;
      stroke: #06B6D4;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#trendArrow);
      path-length: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawTrend 5.2s ease-in-out 0.2s forwards;
    }

    .trend-dot {
      fill: #FFFFFF;
      stroke: #06B6D4;
      stroke-width: 4;
      opacity: 0;
    }

    .trend-dot.d0 { animation: dotReveal 0.3s ease-out 0.2s forwards; }
    .trend-dot.d1 { animation: dotReveal 0.3s ease-out 1.1s forwards; }
    .trend-dot.d2 { animation: dotReveal 0.3s ease-out 2s forwards; }
    .trend-dot.d3 { animation: dotReveal 0.3s ease-out 2.9s forwards; }
    .trend-dot.d4 { animation: dotReveal 0.3s ease-out 3.8s forwards; }
    .trend-dot.d5 { animation: dotReveal 0.3s ease-out 4.7s forwards; }

    .outcome {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: outcomeReveal 0.8s ease-out 5.7s forwards;
    }

    .down-arrow {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: drawArrow 0.7s ease-out 6.25s forwards;
    }

    @keyframes barFocus {
      0%, 100% {
        fill: #FDE4D8;
        stroke-width: 2;
        transform: scale(1);
      }
      45% {
        fill: #F54E00;
        stroke-width: 3;
        transform: scale(1.025);
      }
    }

    @keyframes chipReveal {
      from { opacity: 0; transform: scale(0.75); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes drawTrend {
      to { stroke-dashoffset: 0; }
    }

    @keyframes dotReveal {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes outcomeReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drawArrow {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .ratio-chip, .trend-draw, .trend-dot, .outcome, .down-arrow {
        animation-duration: 0.001s !important;
        animation-delay: 0s !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FCFAF8"/>
  <rect width="1200" height="800" fill="url(#dotGrid)"/>

  <!-- Heading -->
  <text x="600" y="58" text-anchor="middle" font-size="40" font-weight="700" fill="#1F1F1F">
    TFR 1.5 across generations
  </text>
  <text x="600" y="98" text-anchor="middle" font-size="22" font-weight="500" fill="#6B6B6B">
    Each woman has an average of 1.5 children
  </text>

  <!-- Core calculation -->
  <g aria-label="Starting calculation">
    <rect x="318" y="122" width="564" height="64" rx="32" fill="#FFFFFF" stroke="#D8D1CB" stroke-width="2"/>
    <circle cx="362" cy="154" r="16" fill="#F54E00"/>
    <path d="M354 158 Q362 166 370 158 M357 150 A5 5 0 0 1 367 150" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="600" y="162" text-anchor="middle" font-size="23" font-weight="600" fill="#1F1F1F">
      100 people → 50 women × 1.5 = 75 children
    </text>
  </g>

  <!-- Plot grid -->
  <g aria-label="Population by generation graph">
    <line x1="136" y1="625" x2="1130" y2="625" class="axis"/>
    <line x1="136" y1="255" x2="136" y2="625" class="axis"/>

    <line x1="136" y1="535" x2="1130" y2="535" class="gridline"/>
    <line x1="136" y1="445" x2="1130" y2="445" class="gridline"/>
    <line x1="136" y1="355" x2="1130" y2="355" class="gridline"/>
    <line x1="136" y1="265" x2="1130" y2="265" class="gridline"/>

    <g fill="#6B6B6B" font-size="17" font-weight="500" text-anchor="end">
      <text x="122" y="631">0</text>
      <text x="122" y="541">25</text>
      <text x="122" y="451">50</text>
      <text x="122" y="361">75</text>
      <text x="122" y="271">100</text>
    </g>

    <text x="48" y="445" text-anchor="middle" font-size="18" font-weight="600" fill="#6B6B6B" transform="rotate(-90 48 445)">
      people in generation
    </text>

    <!-- Bars: each new cohort is 0.75 of the previous cohort -->
    <rect class="bar g0" x="160" y="265" width="100" height="360" rx="8"/>
    <rect class="bar g1" x="330" y="355" width="100" height="270" rx="8"/>
    <rect class="bar g2" x="500" y="423" width="100" height="202" rx="8"/>
    <rect class="bar g3" x="670" y="474" width="100" height="151" rx="8"/>
    <rect class="bar g4" x="840" y="510" width="100" height="115" rx="8"/>
    <rect class="bar g5" x="1010" y="539" width="100" height="86" rx="8"/>

    <!-- Static faint trend keeps the initial frame meaningful -->
    <path d="M210 265 L380 355 L550 423 L720 474 L890 510 L1060 539"
          fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.18"/>

    <!-- Animated decline trend -->
    <path class="trend-draw" pathLength="1"
          d="M210 265 L380 355 L550 423 L720 474 L890 510 L1060 539"/>

    <circle class="trend-dot d0" cx="210" cy="265" r="8"/>
    <circle class="trend-dot d1" cx="380" cy="355" r="8"/>
    <circle class="trend-dot d2" cx="550" cy="423" r="8"/>
    <circle class="trend-dot d3" cx="720" cy="474" r="8"/>
    <circle class="trend-dot d4" cx="890" cy="510" r="8"/>
    <circle class="trend-dot d5" cx="1060" cy="539" r="8"/>

    <!-- Values -->
    <g text-anchor="middle" font-size="25" font-weight="700" fill="#1F1F1F"
       style="paint-order:stroke; stroke:#FCFAF8; stroke-width:6px; stroke-linejoin:round;">
      <text x="210" y="244">100</text>
      <text x="380" y="334">75</text>
      <text x="550" y="402">56</text>
      <text x="720" y="453">42</text>
      <text x="890" y="489">32</text>
      <text x="1060" y="518">24</text>
    </g>

    <!-- Repeated replacement ratio -->
    <g class="ratio-chip c1">
      <rect x="270" y="294" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="320" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#087E91">× 0.75</text>
    </g>
    <g class="ratio-chip c2">
      <rect x="440" y="373" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="490" y="397" text-anchor="middle" font-size="17" font-weight="700" fill="#087E91">× 0.75</text>
    </g>
    <g class="ratio-chip c3">
      <rect x="610" y="433" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="660" y="457" text-anchor="middle" font-size="17" font-weight="700" fill="#087E91">× 0.75</text>
    </g>
    <g class="ratio-chip c4">
      <rect x="780" y="475" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="830" y="499" text-anchor="middle" font-size="17" font-weight="700" fill="#087E91">× 0.75</text>
    </g>
    <g class="ratio-chip c5">
      <rect x="950" y="506" width="100" height="36" rx="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
      <text x="1000" y="530" text-anchor="middle" font-size="17" font-weight="700" fill="#087E91">× 0.75</text>
    </g>

    <!-- Generation labels -->
    <g text-anchor="middle">
      <g fill="#1F1F1F" font-size="19" font-weight="700">
        <text x="210" y="657">G0</text>
        <text x="380" y="657">G1</text>
        <text x="550" y="657">G2</text>
        <text x="720" y="657">G3</text>
        <text x="890" y="657">G4</text>
        <text x="1060" y="657">G5</text>
      </g>
      <g fill="#6B6B6B" font-size="15" font-weight="500">
        <text x="210" y="679">starting cohort</text>
        <text x="380" y="679">children</text>
        <text x="550" y="679">grandchildren</text>
        <text x="720" y="679">next generation</text>
        <text x="890" y="679">next generation</text>
        <text x="1060" y="679">next generation</text>
      </g>
    </g>
  </g>

  <!-- Final long-term conclusion -->
  <g class="outcome">
    <path class="down-arrow" pathLength="1" d="M388 724 C448 744 493 744 540 724"
          fill="none" stroke="#F54E00" stroke-width="4" stroke-linecap="round"/>
    <path d="M536 714 L552 723 L537 733" fill="none" stroke="#F54E00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="708" y="736" text-anchor="middle" font-size="26" font-weight="700" fill="#F54E00">
      Smaller cohorts replace larger ones → population declines
    </text>
  </g>

  <text x="600" y="782" text-anchor="middle" font-size="15" font-weight="500" fill="#6B6B6B">
    Simplified cohort model: equal numbers of women and men, constant fertility and survival, and no migration
  </text>
</svg>